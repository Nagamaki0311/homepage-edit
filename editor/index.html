<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ビジュアルサイトビルダー</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<meta name="theme-color" content="#1f1f1f">
</head>
<body>
<div class="app">
  <header class="app__header">
    <span class="app__title">サイトエディタ</span>
    <span class="app__status" id="status"></span>
    <div class="app__actions">
      <button id="undo-btn" type="button" title="戻す" disabled>戻す</button>
      <button id="redo-btn" type="button" title="やり直す" disabled>やり直す</button>
      <button id="export-zip-btn" type="button">ZIPで書き出し</button>
      <button id="publish-btn" type="button">更新</button>
    </div>
  </header>

  <div class="app__preview">
    <iframe id="preview" title="プレビュー" sandbox="allow-same-origin"></iframe>
  </div>

  <nav class="app__tabs">
    <button type="button" data-tab="sections" class="is-active">セクション</button>
    <button type="button" data-tab="structure">構成</button>
    <button type="button" data-tab="theme">テーマ</button>
  </nav>

  <div class="app__panel" id="panel"></div>
</div>

<script type="module" src="./app/main.js"></script>
</body>
</html>
